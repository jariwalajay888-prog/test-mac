name: macOS GUI Remote
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-14
    timeout-minutes: 355

    steps:
      - name: Open GUI apps so screen has content
        run: |
          open -a Finder
          open -a Safari
          sleep 4

      - name: Grant screen recording TCC permission to ARDAgent
        run: |
          # Allow ARDAgent to capture screen (fixes "Screen recording might be disabled")
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access \
            (service, client, client_type, auth_value, auth_reason, auth_version) \
            VALUES ('kTCCServiceScreenCapture', 'com.apple.RemoteDesktop', 0, 2, 4, 1);" 2>/dev/null || true
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access \
            (service, client, client_type, auth_value, auth_reason, auth_version) \
            VALUES ('kTCCServiceScreenCapture', 'com.apple.screensharing.agent', 0, 2, 4, 1);" 2>/dev/null || true
          echo "TCC screen recording permission granted"

      - name: Create vncuser with known password
        run: |
          # Create brand-new local user (dscl -passwd works on new user, no old pw needed)
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 503
          sudo dscl . -create /Users/vncuser PrimaryGroupID 80
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "Mac@1234"
          sudo dscl . -append /Groups/admin GroupMembership vncuser
          sudo createhomedir -c -u vncuser 2>/dev/null || true
          echo "vncuser created with password Mac@1234"

      - name: Enable VNC Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "Mac@1234" \
            -restart -agent
          sleep 3
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 2
          echo "VNC ready - Username: vncuser  Password: Mac@1234"

      - name: Install noVNC and websockify
        run: |
          pip3 install websockify --break-system-packages
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Start noVNC proxy
        run: |
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3

      - name: Install and start Cloudflare tunnel
        run: |
          brew install cloudflared
          cloudflared tunnel --url http://localhost:6080 &
          sleep 10
          echo "========================================"
          echo "  OPEN THE trycloudflare.com URL ABOVE  "
          echo "  VNC Password: Mac@1234                "
          echo "========================================"

      - name: Keep alive (6 hours)
        run: sleep 21300
