name: macOS GUI Remote
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-14
    timeout-minutes: 355

    steps:
      - name: Open GUI apps so screen has content
        run: |
          open -a Finder
          open -a Safari
          sleep 4

      - name: Disable macOS animations (smoother DeskIn experience)
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool true
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
          defaults write com.apple.dock launchanim -bool false
          defaults write NSGlobalDomain NSWindowResizeTime -float 0.001
          killall Dock 2>/dev/null || true

      - name: Free up RAM (disable unused services)
        run: |
          # Disable Spotlight indexing
          sudo mdutil -a -i off 2>/dev/null || true
          # Kill memory-hungry background processes
          sudo killall -9 mds mds_stores 2>/dev/null || true
          sudo killall -9 com.apple.photolibraryd 2>/dev/null || true
          sudo killall -9 bird 2>/dev/null || true
          # Purge inactive memory
          sudo purge
          echo "RAM freed. Available memory:"
          vm_stat | grep "Pages free\|Pages inactive"

      - name: Install DeskIn
        run: |
          curl -L "https://dl.deskin.io/mac/DeskIn_Setup_v3.3.3.3.pkg" -o /tmp/deskin.pkg
          sudo installer -pkg /tmp/deskin.pkg -target /
          echo "DeskIn installed"

      - name: Grant TCC permissions to DeskIn (screen capture + control)
        run: |
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          BUNDLE_ID=$(defaults read /Applications/DeskIn.app/Contents/Info CFBundleIdentifier 2>/dev/null || \
                      defaults read "/Applications/Deskln.app/Contents/Info" CFBundleIdentifier 2>/dev/null || \
                      echo "io.deskin.DeskIn")
          echo "DeskIn Bundle ID: $BUNDLE_ID"
          for SERVICE in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent; do
            sudo sqlite3 "$TCC_DB" \
              "INSERT OR REPLACE INTO access \
              (service, client, client_type, auth_value, auth_reason, auth_version) \
              VALUES ('$SERVICE', '$BUNDLE_ID', 0, 2, 4, 1);" 2>/dev/null || true
          done
          echo "TCC permissions granted for DeskIn"

      - name: Start DeskIn and get device ID
        run: |
          open -a DeskIn 2>/dev/null || open -a Deskln 2>/dev/null || true
          sleep 20
          # Find device ID from preferences and config files
          BUNDLE_ID=$(defaults read /Applications/DeskIn.app/Contents/Info CFBundleIdentifier 2>/dev/null || echo "io.deskin.DeskIn")
          PREF_FILE=~/Library/Preferences/${BUNDLE_ID}.plist
          PREF_ID=$(defaults read "$BUNDLE_ID" 2>/dev/null | grep -i 'deviceid\|device_id\|devid\|peerid' | grep -oE '[0-9]{6,12}' | head -1)
          CONFIG_ID=$(find ~/Library/Application\ Support/ /Library/Application\ Support/ -maxdepth 5 \
            \( -name "*.conf" -o -name "*.json" -o -name "*.ini" -o -name "*.plist" \) 2>/dev/null | \
            xargs grep -ril "deviceid\|device_id" 2>/dev/null | head -3 | \
            xargs grep -oh '[0-9]\{6,12\}' 2>/dev/null | head -1)
          DEVICE_ID="${PREF_ID:-$CONFIG_ID}"
          echo "========================================"
          echo "  DeskIn is running!"
          if [ -n "$DEVICE_ID" ]; then
            echo "  Device ID: $DEVICE_ID"
          else
            echo "  Device ID: SSH in (tmate below) and run:"
            echo "  find ~/Library -path '*esk*' -type f 2>/dev/null | xargs grep -rl device"
          fi
          echo ""
          echo "  Connect via: DeskIn app on your PC/phone"
          echo "  Temporary password: shown inside DeskIn app"
          echo "========================================"

      - name: Start tmate SSH session (detached)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: Keep alive (6 hours)
        run: sleep 21300
