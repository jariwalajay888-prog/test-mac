name: macOS GUI Remote
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-14
    timeout-minutes: 355

    steps:
      - name: Open GUI apps so screen has content
        run: |
          open -a Finder
          open -a Safari
          sleep 4

      - name: Lower resolution and disable animations (reduces VNC lag)
        run: |
          brew install jakehilborn/jakehilborn/displayplacer 2>/dev/null || true
          DISPLAY_ID=$(displayplacer list 2>/dev/null | grep 'Persistent screen id' | head -1 | awk '{print $NF}')
          if [ -n "$DISPLAY_ID" ]; then
            displayplacer "id:$DISPLAY_ID res:1280x720 hz:60 color_depth:16 scaling:off origin:(0,0) degree:0" 2>/dev/null || true
          fi
          defaults write com.apple.universalaccess reduceMotion -bool true
          defaults write com.apple.universalaccess reduceTransparency -bool true
          defaults write NSGlobalDomain NSAutomaticWindowAnimationsEnabled -bool false
          defaults write com.apple.dock launchanim -bool false
          defaults write NSGlobalDomain QLPanelAnimationDuration -float 0
          defaults write com.apple.dock expose-animation-duration -float 0.1
          defaults write NSGlobalDomain NSWindowResizeTime -float 0.001
          killall Dock 2>/dev/null || true

      - name: Free up RAM (disable unused services)
        run: |
          sudo mdutil -a -i off 2>/dev/null || true
          sudo killall -9 mds mds_stores 2>/dev/null || true
          sudo killall -9 com.apple.photolibraryd 2>/dev/null || true
          sudo killall -9 bird 2>/dev/null || true
          sudo purge
          echo "RAM freed"

      - name: Grant TCC permissions to ARDAgent and DeskIn
        run: |
          TCC_DB="/Library/Application Support/com.apple.TCC/TCC.db"
          for SERVICE in kTCCServiceScreenCapture kTCCServiceAccessibility kTCCServicePostEvent kTCCServiceListenEvent kTCCServiceMicrophone; do
            for CLIENT in com.apple.RemoteDesktop com.apple.screensharing.agent com.deskin.client; do
              sudo sqlite3 "$TCC_DB" \
                "INSERT OR REPLACE INTO access \
                (service, client, client_type, auth_value, auth_reason, auth_version) \
                VALUES ('$SERVICE', '$CLIENT', 0, 2, 4, 1);" 2>/dev/null || true
            done
          done
          echo "TCC permissions granted"

      - name: Create vncuser with known password
        run: |
          sudo dscl . -create /Users/vncuser
          sudo dscl . -create /Users/vncuser UserShell /bin/bash
          sudo dscl . -create /Users/vncuser RealName "VNC User"
          sudo dscl . -create /Users/vncuser UniqueID 503
          sudo dscl . -create /Users/vncuser PrimaryGroupID 80
          sudo dscl . -create /Users/vncuser NFSHomeDirectory /Users/vncuser
          sudo dscl . -passwd /Users/vncuser "Mac@1234"
          sudo dscl . -append /Groups/admin GroupMembership vncuser
          sudo createhomedir -c -u vncuser 2>/dev/null || true
          sudo -u vncuser defaults write com.apple.SetupAssistant DidSeePrivacyConsent -bool true
          sudo -u vncuser defaults write com.apple.SetupAssistant DidSeeCloudSetup -bool true
          sudo -u vncuser defaults write com.apple.SetupAssistant DidSeeSiriSetup -bool true
          sudo -u vncuser defaults write com.apple.SetupAssistant GestureMovieSeen none
          sudo -u vncuser defaults write com.apple.SetupAssistant LastSeenCloudProductVersion "$(sw_vers -productVersion)"
          sudo -u vncuser defaults write com.apple.SetupAssistant LastSeenBuddyBuildVersion "$(sw_vers -buildVersion)"
          echo "vncuser created with password Mac@1234"

      - name: Enable VNC Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure \
            -allowAccessFor -allUsers \
            -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "Mac@1234" \
            -restart -agent
          sleep 3
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          sleep 2

      - name: Install noVNC and websockify
        run: |
          pip3 install websockify --break-system-packages
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Start noVNC proxy
        run: |
          (websockify --compress --web=/tmp/novnc 6080 localhost:5900 2>/dev/null || \
           websockify --web=/tmp/novnc 6080 localhost:5900) &
          sleep 3

      - name: Install DeskIn
        run: |
          curl -L "https://dl.deskin.io/mac/DeskIn_Setup_v3.3.3.3.pkg" -o /tmp/deskin.pkg
          sudo installer -pkg /tmp/deskin.pkg -target /
          echo "DeskIn installed"

      - name: Start DeskIn and auto-dismiss popups
        run: |
          open -a DeskIn 2>/dev/null || true
          sleep 15
          osascript << 'OSEOF'
          repeat 8 times
            tell application "System Events"
              repeat with p in (every process whose visible is true)
                try
                  repeat with w in (every window of p)
                    try
                      repeat with b in (every button of w)
                        if name of b is "Don't Allow" or name of b is "OK" then
                          click b
                        end if
                      end repeat
                    end try
                  end repeat
                end try
              end repeat
            end tell
            delay 1
          end repeat
          OSEOF
          osascript << 'OSEOF'
          tell application "DeskIn" to activate
          delay 2
          tell application "System Events"
            tell process "DeskIn"
              try
                set value of text field 1 of window 1 to "Mac@1234"
                set value of text field 2 of window 1 to "Mac@1234"
                delay 1
                click button "Next" of window 1
              end try
            end tell
          end tell
          OSEOF
          echo "DeskIn started"

      - name: Start Cloudflare tunnel
        run: |
          brew install cloudflared
          cloudflared tunnel --url http://localhost:6080 > /tmp/cf.log 2>&1 &
          sleep 12
          CF_URL=$(grep -oE 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cf.log | head -1)
          echo "========================================"
          echo "  Browser mein kholo:"
          echo "  ${CF_URL}/vnc.html?autoconnect=true&quality=3&compression=3&resize=scale"
          echo "  VNC Password: Mac@1234"
          echo ""
          echo "  DeskIn window se Device ID note karo"
          echo "  DeskIn app mein: Device ID + Password: Mac@1234"
          echo "========================================"

      - name: Start tmate SSH session (detached)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: true
          limit-access-to-actor: false

      - name: Keep alive (6 hours)
        run: sleep 21300
