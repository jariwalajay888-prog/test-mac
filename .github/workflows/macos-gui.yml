name: macOS GUI Remote
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-latest
    timeout-minutes: 355

    steps:
      - name: Enable VNC Screen Sharing
        run: |
          # Open some apps to populate the screen
          open -a Finder &
          open -a Terminal &
          sleep 5
          
          # Install x11vnc which uses CoreGraphics to capture macOS screen directly
          brew install x11vnc
          
          # Create VNC password
          mkdir -p ~/.vnc
          x11vnc -storepasswd Mac@1234 /tmp/vncpasswd
          
          # Start x11vnc - tries display :0 first, then falls back to screenshot mode
          x11vnc -display :0 -rfbauth /tmp/vncpasswd -rfbport 5900 -forever -bg -noxdamage 2>/dev/null || \
          x11vnc -rawfb screenshot -rfbauth /tmp/vncpasswd -rfbport 5900 -forever -bg
          
          sleep 3
          echo "VNC ready on port 5900 - Password: Mac@1234"

      - name: Install noVNC and websockify
        run: |
          pip3 install websockify --break-system-packages
          git clone https://github.com/novnc/noVNC.git /tmp/novnc

      - name: Start noVNC proxy
        run: |
          /tmp/novnc/utils/novnc_proxy --vnc localhost:5900 --listen 6080 &
          sleep 3
          echo "noVNC running on port 6080"

      - name: Install and start Cloudflare tunnel
        run: |
          brew install cloudflared
          cloudflared tunnel --url http://localhost:6080 &
          sleep 8
          echo ""
          echo "========================================="
          echo "OPEN THIS URL IN YOUR BROWSER:"
          echo "(check above lines for: trycloudflare.com URL)"
          echo "VNC Password: Mac@1234"
          echo "========================================="

      - name: Keep alive (6 hours)
        run: sleep 21000
