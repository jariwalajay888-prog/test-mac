name: macOS GUI Remote
on: workflow_dispatch

jobs:
  gui:
    runs-on: macos-latest
    timeout-minutes: 355

    steps:
      - name: Enable VNC Screen Sharing
        run: |
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes \
            -clientopts -setvncpw -vncpw "Mac@1234" \
            -restart -agent -privs -all
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true
          echo "VNC enabled on port 5900"

      - name: Install tmate
        run: brew install tmate

      - name: Start tmate session
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          echo ""
          echo "========================================="
          echo "COPY THIS COMMAND AND RUN IN POWERSHELL:"
          echo ""
          # Extract host and port from tmate ssh command
          HOST=$(echo $TMATE_SSH | grep -oP '(?<=@)[^ ]+' | head -1)
          PORT=$(echo $TMATE_SSH | grep -oP '(?<=-p )\d+' | head -1)
          USER=$(echo $TMATE_SSH | grep -oP '(?<=ssh )[^@]+')
          echo "ssh -L 5900:localhost:5900 -p $PORT $USER@$HOST"
          echo ""
          echo "Then open VNC Viewer -> connect to: localhost:5900"
          echo "VNC Password: Mac@1234"
          echo "========================================="

      - name: Keep alive (6 hours)
        run: sleep 21000
